<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kontakta oss</title>

  <link rel="stylesheet" href="style.css" />

  <script
    src="https://kit.fontawesome.com/64d58efce2.js"
    crossorigin="anonymous">
  </script>

  <script
    src="https://www.google.com/recaptcha/api.js"
    async
    defer>
  </script>

</head>

<body>
  <div class="container">

    <span class="big-circle"></span>

    <img src="img/shape.png" class="square" alt="" />

    <div class="form">

      <div class="contact-info">

        <h3 class="title">Kom i kontakt med oss</h3>

        <p class="text">
          Har du frågor till oss kan du enkelt använda kontaktformuläret
          för att komma i kontakt med rätt avdelning inom Karlskrona Hockey.
        </p>

        <div class="info">

          <h3 class="title">Besöksadress</h3>

          <div class="information">
            <img src="img/location.png" class="icon" alt="" />
            <p>Arenavägen 19, 371 55 KARLSKRONA</p>
          </div>

          <div class="information">
            <img src="img/email.png" class="icon" alt="" />
            <p>kansli@khk.se</p>
          </div>

        </div>

        <div class="social-media">

          <p>Våra sociala medier:</p>

          <div class="social-icons">

            <a href="https://www.facebook.com/KarlskronaHK" target="_blank">
              <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://www.x.com/khkofficiella" target="_blank">
              <i class="fab fa-twitter"></i>
            </a>

            <a href="https://www.instagram.com/khkofficiella" target="_blank">
              <i class="fab fa-instagram"></i>
            </a>

          </div>

        </div>

      </div>

      <div class="contact-form">

        <span class="circle one"></span>
        <span class="circle two"></span>

        <form id="contactForm" autocomplete="off">

          <h3 class="title">Kontakta oss</h3>

          <div class="input-container">
            <input
              type="text"
              name="name"
              class="input"
              required
            />
            <label>Namn *</label>
            <span>Namn *</span>
          </div>

          <div class="input-container">
            <input
              type="email"
              name="email"
              class="input"
              required
            />
            <label>E-post *</label>
            <span>E-post *</span>
          </div>

          <div class="checkbox-container">
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="contactByPhone"
              >
              Kontakta mig per telefon
            </label>
          </div>

          <div
            class="input-container"
            id="phoneContainer"
            style="display:none;"
          >
            <input
              type="tel"
              name="phone"
              id="phone"
              class="input"
            />
            <label>Mobilnummer *</label>
            <span>Mobilnummer *</span>
          </div>

          <div class="input-container">

            <select
              name="subject"
              class="input"
              required
            >
              <option value="">Välj ärende *</option>
              <option value="biljetter">Biljetter</option>
              <option value="medlemskap">Medlemskap</option>
              <option value="sponsring">Partnerskap / Sponsring</option>
              <option value="hockeyskola">Hockeyskola</option>
              <option value="press">Press</option>
              <option value="ovrigt">Övrigt</option>
            </select>

          </div>

          <div class="input-container textarea">
            <textarea
              name="message"
              class="input"
              required
            ></textarea>

            <label>Meddelande *</label>
            <span>Meddelande *</span>

          </div>

          <div class="checkbox-container gdpr">

            <label class="checkbox-label">

              <input
                type="checkbox"
                name="gdpr"
                required
              >

              Jag godkänner att Karlskrona Hockey behandlar mina
              personuppgifter för att kunna besvara mitt ärende. *

            </label>

          </div>

          <br>

          <div
            class="g-recaptcha"
            data-sitekey="DIN_SITE_KEY">
          </div>

          <br>

          <input
            type="submit"
            value="Skicka"
            class="btn"
          />

        </form>

      </div>

    </div>

  </div>

</body>
</html>
