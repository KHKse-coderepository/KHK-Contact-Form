<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kontakta oss</title>

  <link rel="stylesheet" href="style.css" />
  
  <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
  <script src="https://web3forms.com/client/script.js" async defer></script>
</head>

<body>
  <div class="container">
    <div class="form">
      <div class="contact-info">
        <h3 class="title">Kom i kontakt med oss</h3>
        <p class="text">
          Har du frågor till oss kan du enkelt använda formuläret för att komma i kontakt med rätt avdelning inom Karlskrona Hockeyklubb.
        </p>
        <div class="info">
          <h3 class="title">Besöksadress</h3>
          <div class="information">
            <img src="img/location.png" class="icon" alt="Adress" />
            <p>Arenavägen 19, 371 55 KARLSKRONA</p>
          </div>
          <div class="information">
            <img src="img/email.png" class="icon" alt="E-post" />
            <p>kansli@khk.se</p>
          </div>
        </div>
        <div class="social-media">
          <p>Våra sociala medier:</p>
          <div class="social-icons">
            <a href="https://www.facebook.com/KarlskronaHK" target="_blank">
              <img src="img/facebook.svg" class="icon" alt="E-post" />
              <i class="fab fa-facebook-f"></i>
            </a>        
            <a href="https://www.instagram.com/khkofficiella" target="_blank">
              <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.x.com/khkofficiella" target="_blank">
              <i class="fab fa-twitter"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <span class="circle one"></span>
        <span class="circle two"></span>
        <form
  id="contactForm"
  autocomplete="off"
  action="https://api.web3forms.com/submit"
  method="POST">

  <!-- Web3Forms -->

  <input
    type="hidden"
    name="access_key"
    value="41b47cd4-0230-425c-832a-342c51674dc2">

  <input
    type="checkbox"
    name="botcheck"
    style="display:none;">

  <input
    type="hidden"
    name="subject"
    value="Nytt kontaktärende från khk.se">

  <input
    type="hidden"
    name="from_name"
    value="Karlskrona Hockey Kontaktformulär">

  <h3 class="title">Kontakta oss</h3>

  <div class="input-container">
    <input
      type="text"
      name="Namn"
      class="input"
      placeholder="Namn *"
      required>
  </div>

  <div class="input-container">
    <input
      type="email"
      name="Epost"
      class="input"
      placeholder="E-post *"
      required>
  </div>

  <div class="checkbox-container">
    <label class="checkbox-label">
      <input
        type="checkbox"
        id="contactByPhone">
      Jag önskar bli kontaktad per telefon
    </label>
  </div>

  <div
    class="input-container"
    id="phoneContainer"
    style="display:none;">
    <input
      type="tel"
      name="Telefonnummer"
      id="phone"
      class="input"
      placeholder="Mobilnummer *">
  </div>

  <div class="input-container">
    <select
      name="Kategori"
      class="input"
      required>
      <option value="" selected disabled>
        Välj ärende *
      </option>
      <option value="Form-Biljetter">
        Biljetter
      </option>
      <option value="Form-Restaurang/Loger">
        Restaurang / Loger
      </option>
      <option value="Form-Medlemskap">
        Medlemskap
      </option>
      <option value="Form-Partnerskap/Sponsring">
        Partnerskap / Sponsring
      </option>
      <option value="Form-Hockeyskola">
        Hockeyskola
      </option>
      <option value="Form-Press">
        Press
      </option>
      <option value="Form-Övrigt">
        Övrigt
      </option>
    </select>
  </div>

  <div class="input-container textarea">
    <textarea
      name="Meddelande"
      class="input"
      placeholder="Meddelande *"
      required></textarea>
  </div>

  <div class="checkbox-container gdpr">
    <label class="checkbox-label">
      <input
        type="checkbox"
        name="GDPR-approved"
        required>
      Jag godkänner att KHK behandlar mina personuppgifter för att kunna besvara mitt ärende. *
    </label>
  </div>

  <div class="h-captcha" data-captcha="true"></div>
          
  <input
    type="submit"
    value="Skicka"
    class="btn">
</form>
      </div>
    </div>
  </div>
<script src="app.js"></script>
</body>
</html>
